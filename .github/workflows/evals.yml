name: evals

# Runs the renamed-public-domain eval suite against a freshly-booted app and
# ingests the scores into Tracer, so voice/plot/continuity quality is trended
# release-over-release (not eyeballed). Manually dispatched (it spends shared
# Gemini free-tier quota). No schedule: it returns sized to W13-0's measure.
#
# Secrets this needs on the Polyphony repo (Settings → Secrets and variables →
# Actions):
#   GEMINI_API_KEY      — the model under test boots with it (fail-fast without).
#   TRACER_INGEST_TOKEN — bearer for Tracer /api/ingest; if unset, the run still
#                         produces a report artifact, it just doesn't ingest.
#   GROQ_API_KEY        — free-tier judge (EVAL_JUDGE_PROVIDER=groq); if unset,
#                         the judge falls back to Gemini (self-graded, labelled).
#                         CEREBRAS/OPENROUTER/MISTRAL_API_KEY are alternates.
# ADMIN_* / SECRET_KEY below are throwaway CI values (ephemeral DB), not secrets.

on:
  workflow_dispatch:
    inputs:
      book:
        description: corpus(es) to grade, space-separated (development corpora; cel = the fidelity gate). Holdout corpora need holdout=yes
        default: dracula frankenstein cel
      steps:
        description: comma list of steps or 'all'
        default: all
      repeat:
        description: run each step N times for a mean±std noise band (N× the LLM cost)
        default: '1'
      env_label:
        description: where the run happened (keep `ci`); put experiment names in a label, not the env
        default: ci
      model:
        description: model under test (sets LLM_MODEL); blank = provider default
        default: ''
      experiment:
        description: optional experiment tag stored as labels.experiment
        default: ''
      base_url:
        description: >-
          grade an EXTERNAL running app (e.g. https://polyphony.rtrentjones.dev
          for a deployed-prompts baseline) instead of booting one here. Leave
          blank to boot this ref's app. External mode needs EVAL_ADMIN_* secrets.
        default: ''
      holdout:
        description: >-
          the frozen HOLDOUT run (SPEC-94 S5): once per release, on that release's tag. Grades
          holdout-a holdout-b (or the one named in `book`) with evals.run --holdout; any other
          book is refused, and so is a dispatch from anything but a tag (the release's
          frozen code). With 'no', a holdout book is refused.
        type: choice
        options: ['no', 'yes']
        default: 'no'
      claude:
        description: >-
          write with Claude (Anthropic, BRD R7.9) instead of Gemini: the eval's own users
          (@polyphony.eval) are listed in ANTHROPIC_USERS for this run. PAID — needs the ANTHROPIC_API_KEY repo secret.
        type: choice
        options: ['no', 'yes']
        default: 'no'
      claude_generate:
        description: >-
          with claude=yes, whether Claude also WRITES (yes, the default and claude=yes's meaning since
          SPEC-90: the eval users are listed in ANTHROPIC_USERS) or only judges (no: the key and the spend
          ceiling are wired for the judge, generation stays on the app's default provider). The report's
          `generator` records which wrote.
        type: choice
        options: ['yes', 'no']
        default: 'yes'
      claude_monthly_usd:
        description: >-
          with claude=yes, the month's Claude eval budget in USD (SPEC-90 D1); earlier runs' spend this
          UTC month is subtracted. Blank = the EVAL_CLAUDE_MONTHLY_USD repo variable, else 100.
        default: ''
      claude_usd_cap:
        description: with claude=yes, an optional tighter per-run ceiling in USD (blank = the month's remainder)
        default: ''
      app_sha:
        description: >-
          E4 (SPEC-95): boot the app (app/, alembic/, alembic.ini, requirements.txt) from this full commit
          sha, a release, instead of this ref's; the harness stays at this ref. Blank = this ref's app.
        default: ''
      from_runs:
        description: >-
          E4: comma-separated evals run ids whose eval-report artifacts the chapter steps read (the
          outline to reuse; the two releases to compare). Blank = none.
        default: ''
      chapters:
        description: "E4's `chapters` step: how many outline chapters to write, in order (0..12; 0 = the outline only)"
        default: '3'
      replicates:
        description: "E4's `chapters` step: how many times to write those chapters afresh in this run (1..6)"
        default: '1'
      judge:
        description: >-
          who judges (SPEC-95 E0): chain = the free judges (with claude=yes, Claude Sonnet only as the last
          resort); claude = Claude Sonnet first, the free judges behind it. claude needs claude=yes (its key
          and spend ceiling) and a booted app. Recorded in each report's judge block (requested_mode).
        type: choice
        options: ['chain', 'claude']
        default: 'chain'
      calibration_run:
        description: >-
          with steps=calibration_answers (SPEC-95 E5): the calibration.yml run id whose calibration-items
          artifact the judge answers (its key is never downloaded)
        default: ''
      ablation:
        description: >-
          SPEC-96 (wave 21): the eval-only prose ablation the booted app runs with, a comma list of
          pov_fix, no_excerpts, no_voices (PROSE_ABLATION); blank = the product as shipped. Recorded
          in each report. Refused for an external base_url and for an app tree (app_sha) without the switch.
        default: ''
  # On-demand trigger for when workflow_dispatch isn't available (e.g. an
  # integration token can't press "Run workflow"): bump evals/.run-eval and push.
  # Path-scoped so ordinary commits don't fire it (this run spends Gemini quota).
  # A push run has no inputs, so it uses the boot-mode defaults: both corpora,
  # all steps, base_url blank (boots this ref's app).
  push:
    paths:
      - evals/.run-eval

# Claude runs (paid) share one group and are never cancelled: a paid run is
# never stopped mid-book, and two never overlap (each reads the month's spend
# before it starts). Other runs keep one per ref, the newest winning.
concurrency:
  group: ${{ github.event.inputs.claude == 'yes' && 'evals-claude' || format('evals-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event.inputs.claude != 'yes' }}

jobs:
  eval:
    runs-on: ubuntu-latest
    # actions: read lets the Claude step read this month's earlier eval reports (W15-0).
    permissions: {contents: read, actions: read}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci_password_12345
          POSTGRES_DB: polyphony_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # CI-only: let the app's 500 handler name the real error (429/quota vs
      # safety-block vs bug) in the response so the eval scorecard is
      # self-diagnosing. DEBUG defaults False, so prod leaks nothing.
      DEBUG: 'true'
      # The eval user is a harness, not an author: a staged outline over a big
      # corpus (thinking tokens count as output) can exceed the free tier's
      # per-author 200k/day, which now pauses the job mid-run by design.
      # The provider's own quota still applies.
      USER_DAILY_TOKEN_LIMIT: '20000000'
      # NOTE: do NOT force temperature to 0 here. Temp=0 homogenizes the voice
      # steps (every character answers a prompt near-identically → attribution
      # collapses, prose degenerates), which defeats the voice measurement. Let
      # each call use its natural temperature; use `--repeat` for the noise band
      # on the judge/voice steps instead of killing sampling.
      # First-boot admin (empty DB): ADMIN_EMAIL/PASSWORD come from the boot-app action.
      # Boot mode uses the CI admin above; external mode (base_url set) needs the
      # target app's real admin — supply EVAL_ADMIN_* as repo secrets for that.
      EVAL_ADMIN_EMAIL: ${{ secrets.EVAL_ADMIN_EMAIL || 'eval-admin@example.com' }}
      EVAL_ADMIN_PASSWORD: ${{ secrets.EVAL_ADMIN_PASSWORD || 'eval_admin_pw_ci_only_12345' }}
      EVAL_BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:8000' }}
      EVAL_ENV_LABEL: ${{ github.event.inputs.env_label || 'ci' }}
      EVAL_EXPERIMENT: ${{ github.event.inputs.experiment || '' }}
      EVAL_TRACER_URL: https://tracer.rtrentjones.dev
      TRACER_INGEST_TOKEN: ${{ secrets.TRACER_INGEST_TOKEN }}
      # EVAL_JUDGE_PROVIDER (the judge chain) is set by the "Judge chain" step
      # from the `judge` input.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      EVAL_CHAPTERS: ${{ github.event.inputs.chapters || '3' }}
      EVAL_CHAPTER_REPLICATES: ${{ github.event.inputs.replicates || '1' }}
    steps:
      - uses: actions/checkout@v4
      # D19-4: holdout-v1 fixes the holdout corpora, the release under test fixes the code; a holdout
      # run from a later tag (E4's harness) must carry holdout-v1's corpora byte for byte.
      - name: Holdout corpora are holdout-v1's (holdout=yes)
        if: ${{ github.event.inputs.holdout == 'yes' }}
        run: |
          git fetch --depth=1 origin "refs/tags/holdout-v1:refs/tags/holdout-v1"
          if ! git diff --quiet holdout-v1 HEAD -- evals/corpora/holdout-a evals/corpora/holdout-b evals/tools/rename.py; then
            echo "::error title=Holdout run::the holdout corpora or their builder differ from holdout-v1's"
            exit 1
          fi
      # E4: a release's app under this ref's harness. The app's tree is replaced exactly (files the
      # release lacks are removed), and GREENLIGHT_SHA makes /__version, so the report's app_sha and
      # the generation cache, name the release. The harness imports app.llm from that tree too.
      - name: App under test (app_sha)
        if: ${{ github.event.inputs.app_sha != '' }}
        env:
          APP_SHA: ${{ github.event.inputs.app_sha }}
        run: |
          if ! printf '%s' "$APP_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::app_sha must be a full 40-character commit sha (got '$APP_SHA')"
            exit 1
          fi
          PATHS="app alembic alembic.ini requirements.txt"
          git fetch --depth=1 origin "$APP_SHA"
          git rm -r -q -- $PATHS
          git checkout "$APP_SHA" -- $PATHS
          if ! git diff --quiet --cached "$APP_SHA" -- $PATHS || ! git diff --quiet -- $PATHS; then
            echo "::error::the app tree is not $APP_SHA's"
            exit 1
          fi
          echo "GREENLIGHT_SHA=$APP_SHA" >> "$GITHUB_ENV"
          {
            echo "### App under test"
            echo "app $APP_SHA (app tree $(git rev-parse "$APP_SHA:app")); harness $(git rev-parse HEAD)"
            git diff --cached --stat HEAD -- $PATHS | tail -1
          } >> "$GITHUB_STEP_SUMMARY"
      # SPEC-96: an experiment arm's ablation, checked against the allow-list (the whole value,
      # so nothing else reaches GITHUB_ENV) and against the app tree under test, after the
      # app_sha overlay: an app without the switch would ignore it and mislabel the arm.
      - name: Prose ablation (ablation)
        env:
          ABLATION: ${{ github.event.inputs.ablation || '' }}
          APP_SHA: ${{ github.event.inputs.app_sha || '' }}
          BASE_URL: ${{ github.event.inputs.base_url || '' }}
        run: |
          if [ -z "$ABLATION" ]; then exit 0; fi
          FLAG='(pov_fix|no_excerpts|no_voices)'
          if ! [[ "$ABLATION" =~ ^$FLAG(,$FLAG)*$ ]]; then
            echo "::error title=Ablation::ablation must be blank or a comma list of pov_fix, no_excerpts, no_voices with no spaces (got '$ABLATION')"
            exit 1
          fi
          if [ -n "$BASE_URL" ]; then
            echo "::error title=Ablation::ablation needs a booted app (base_url is set: the external app's settings are not this run's)"
            exit 1
          fi
          if ! grep -q 'PROSE_ABLATION' app/core/config.py 2>/dev/null; then
            echo "::error title=Ablation::the app under test (${APP_SHA:-this ref}) has no PROSE_ABLATION switch: run ablation=$ABLATION on an app that has it, or leave ablation blank"
            exit 1
          fi
          echo "PROSE_ABLATION=$ABLATION" >> "$GITHUB_ENV"
          echo "prose ablation: $ABLATION" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: Earlier runs' reports (from_runs)
        if: ${{ github.event.inputs.from_runs != '' }}
        env:
          FROM_RUNS: ${{ github.event.inputs.from_runs }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in ${FROM_RUNS//,/ }; do
            if ! printf '%s' "$id" | grep -Eq '^[0-9]+$'; then
              echo "::error::from_runs takes run ids (got '$id')"
              exit 1
            fi
            gh run download "$id" -R "$GITHUB_REPOSITORY" -p "eval-report-$id*" -D "prior-reports/$id"
          done
          echo "EVAL_PRIOR_REPORTS=$PWD/prior-reports" >> "$GITHUB_ENV"
      # Judge on a DIFFERENT free vendor than the model under test: removes
      # self-preference bias and takes judge calls off the shared Gemini daily
      # budget. Fail-soft — until GROQ_API_KEY is set the judge falls back to
      # the app provider and the report labels the run self-graded. With claude=yes
      # (its key exported) Claude Sonnet is the last resort once the free judges'
      # daily caps are spent (SPEC-90 D14): self-graded, labelled, its cost counted.
      # judge=claude (SPEC-95 E0) puts Claude first instead (the judge picks Sonnet,
      # never Opus: harness/judge.py _fast_if_claude), the free chain behind it. It
      # needs claude=yes, since the key, the month's spend guard and the run's
      # ceiling are wired only by the claude=yes step, and a booted app (that step
      # is skipped for an external base_url): otherwise it is refused, not run on
      # the free chain under a "claude" label.
      - name: Judge chain
        env:
          JUDGE: ${{ github.event.inputs.judge || 'chain' }}
          CLAUDE: ${{ github.event.inputs.claude || 'no' }}
          BASE_URL: ${{ github.event.inputs.base_url || '' }}
          FREE_CHAIN: ${{ vars.EVAL_JUDGE_PROVIDER || 'groq,openrouter' }}
        run: |
          case "$JUDGE" in
            chain)
              CHAIN="$FREE_CHAIN"
              if [ "$CLAUDE" = "yes" ]; then CHAIN="$FREE_CHAIN,anthropic"; fi
              ;;
            claude)
              if [ "$CLAUDE" != "yes" ]; then
                echo "::error title=Judge::judge=claude needs claude=yes (the Anthropic key, the spend guard and the run's ceiling are wired only then)"
                exit 1
              fi
              if [ -n "$BASE_URL" ]; then
                echo "::error title=Judge::judge=claude needs a booted app (base_url is set: no Anthropic key or ceiling is wired in external mode)"
                exit 1
              fi
              CHAIN="anthropic,$FREE_CHAIN"
              ;;
            *)
              echo "::error title=Judge::judge must be chain or claude (got '$JUDGE')"
              exit 1
              ;;
          esac
          echo "judge chain: $CHAIN (judge=$JUDGE)"
          {
            echo "EVAL_JUDGE_PROVIDER=$CHAIN"
            echo "EVAL_JUDGE_MODE=$JUDGE"
          } >> "$GITHUB_ENV"
      # SPEC-95 E5: the human calibration page's items (never its key) for the
      # opt-in calibration_answers step, which the judge chain answers as the page asks.
      - name: Calibration items (steps=calibration_answers)
        env:
          STEPS: ${{ github.event.inputs.steps || 'all' }}
          CAL_RUN: ${{ github.event.inputs.calibration_run || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case ",$STEPS," in
            *,calibration_answers,*) ;;
            *) exit 0 ;;
          esac
          if ! printf '%s' "$CAL_RUN" | grep -Eq '^[0-9]+$'; then
            echo "::error title=Calibration::steps=calibration_answers needs calibration_run, a calibration.yml run id (got '$CAL_RUN')"
            exit 1
          fi
          DIR="$RUNNER_TEMP/calibration-items"
          gh run download "$CAL_RUN" -R "$GITHUB_REPOSITORY" -n calibration-items -D "$DIR"
          if [ ! -f "$DIR/items.json" ] || [ -n "$(find "$DIR" -name 'key*.json')" ]; then
            echo "::error title=Calibration::the calibration-items artifact of run $CAL_RUN holds no items.json, or holds a key"
            exit 1
          fi
          echo "EVAL_CALIBRATION_ITEMS=$DIR/items.json" >> "$GITHUB_ENV"
      - name: Preflight — Gemini key present (boot mode only)
        if: ${{ github.event.inputs.base_url == '' }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is not set on this repo — the app can't boot for the eval. Add it in repo Actions secrets."
            exit 1
          fi
      # The model under test: exported only when the dispatch names one, so a
      # blank input (or a push run) leaves LLM_MODEL unset and the app boots on
      # its provider default. run.py labels the Tracer run from LLM_MODEL.
      - name: Model under test
        env:
          MODEL: ${{ github.event.inputs.model || '' }}
        run: |
          if [ -n "$MODEL" ]; then echo "LLM_MODEL=$MODEL" >> "$GITHUB_ENV"; fi
      # Opt-in and paid: only a dispatch with claude=yes lists the eval users for Claude. Each run
      # boots an empty database, so the app's MONTHLY_COST_CEILING_USD sees only this run: it is set
      # to what is left of the month's eval budget after earlier runs' spend, read from their
      # eval-report artifacts (evals/spend.py; W15-0). A push run never uses Claude.
      - name: Claude for the eval users (claude=yes)
        if: ${{ github.event.inputs.claude == 'yes' && github.event.inputs.base_url == '' }}
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET: ${{ github.event.inputs.claude_monthly_usd || vars.EVAL_CLAUDE_MONTHLY_USD || '100' }}
          CAP: ${{ github.event.inputs.claude_usd_cap || '' }}
          GENERATE: ${{ github.event.inputs.claude_generate || 'yes' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GENERATE" in
            yes|no) ;;
            *) echo "::error::claude_generate must be yes or no (got '$GENERATE')."; exit 1 ;;
          esac
          if [ -z "$KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set on this repo — add it in repo Actions secrets."
            exit 1
          fi
          # A zero or blank ceiling reads as "no ceiling" to the app (app/llm/spend.py): refuse it.
          positive() { printf '%s' "$1" | grep -Eq '^[0-9]+(\.[0-9]+)?$' && awk -v c="$1" 'BEGIN { exit !(c > 0) }'; }
          if ! positive "$BUDGET"; then
            echo "::error::claude_monthly_usd must be a positive number of dollars (got '$BUDGET')."
            exit 1
          fi
          if [ -n "$CAP" ] && ! positive "$CAP"; then
            echo "::error::claude_usd_cap must be blank or a positive number of dollars (got '$CAP')."
            exit 1
          fi
          # This month's runs (any outcome: a failed or cancelled run spent too), every attempt's
          # artifact, this run's earlier attempts included (this attempt has uploaded nothing yet).
          # A run whose report artifacts are missing or expired counts 0.
          RUNS="$RUNNER_TEMP/eval-spend"
          mkdir -p "$RUNS"
          gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/evals.yml/runs" \
            -f created=">=$(date -u +%Y-%m-01)" -f per_page=100 --jq '.workflow_runs[].id' |
            while read -r id; do
              gh run download "$id" -R "$GITHUB_REPOSITORY" -p "eval-report-$id*" -D "$RUNS/$id" \
                >/dev/null 2>&1 || echo "run $id: no eval-report artifact, counted as 0"
            done
          if ! CEILING="$(python3 -m evals.spend "$RUNS" --budget "$BUDGET" ${CAP:+--cap "$CAP"})"; then
            echo "$CEILING"
            exit 1
          fi
          echo "this run's ceiling: \$$CEILING" | tee -a "$GITHUB_STEP_SUMMARY"
          # Uploaded with the reports: a run killed before any report counts at its ceiling.
          printf '{"ceiling": %s}\n' "$CEILING" > eval-ceiling.json
          {
            echo "ANTHROPIC_API_KEY=$KEY"
            echo "MONTHLY_COST_CEILING_USD=$CEILING"
            # claude_generate=yes (the default): the eval writes with Claude, as users it registers
            # under @polyphony.eval (evals/harness/client.py). With no, Claude only judges: no eval
            # user is routed to it, so generation stays on the app's default provider.
            if [ "$GENERATE" = "yes" ]; then
              echo "ANTHROPIC_USERS=@polyphony.eval"
              echo "EVAL_MODEL_LABEL=claude-opus-5-5"
            fi
          } >> "$GITHUB_ENV"
          echo "Claude writes: $GENERATE" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/boot-app
        with:
          serve: ${{ github.event.inputs.base_url == '' }}
      - name: Run evals + ingest to Tracer
        env:
          BASE_LABEL: ${{ github.event.inputs.env_label || 'ci' }}
          STEPS: ${{ github.event.inputs.steps || 'all' }}
          BOOK_INPUT: ${{ github.event.inputs.book }}
          HOLDOUT: ${{ github.event.inputs.holdout || 'no' }}
          REPEAT_INPUT: ${{ github.event.inputs.repeat }}
        run: |
          # Book selection: dispatch input wins; else on a push read the book
          # names from the sentinel file (so a single push can grade just one
          # book to stay inside the Gemini free-tier quota); else both.
          BOOKS="$BOOK_INPUT"
          HOLDOUT_FLAG=""
          if [ "$HOLDOUT" = "yes" ]; then
            # The frozen holdout (SPEC-94 S5) runs only on a release's frozen
            # code: dispatched from a tag, never from a branch (D19-4).
            if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
              echo "::error title=Holdout run::holdout=yes runs only from a tag (dispatched from ${GITHUB_REF_TYPE:-an unknown ref type} ${GITHUB_REF_NAME:-})"
              exit 1
            fi
            # Exactly holdout-a / holdout-b. The book input's development
            # default means "both holdout books".
            if [ -z "$BOOKS" ] || [ "$BOOKS" = "dracula frankenstein cel" ]; then
              BOOKS="holdout-a holdout-b"
            fi
            for BK in $BOOKS; do
              case "$BK" in
                holdout-a|holdout-b) ;;
                *) echo "::error title=Holdout run::holdout=yes grades only holdout-a / holdout-b, not $BK"; exit 1 ;;
              esac
            done
            HOLDOUT_FLAG="--holdout"
          else
            if [ -z "$BOOKS" ]; then
              BOOKS="$(grep -oiE 'dracula|frankenstein|cel' evals/.run-eval | tr '\n' ' ' || true)"
            fi
            BOOKS="${BOOKS:-dracula frankenstein cel}"
            for BK in $BOOKS; do
              case "$BK" in
                holdout-*) echo "::error title=Holdout run::$BK is a holdout corpus: dispatch with holdout=yes"; exit 1 ;;
              esac
            done
          fi
          # Repeat count: dispatch input wins; else a "repeat: N" line in the
          # sentinel (mean±std noise band; N× the LLM cost — budget for it).
          REPEAT="$REPEAT_INPUT"
          if [ -z "$REPEAT" ]; then
            REPEAT="$(grep -oiE 'repeat: *[0-9]+' evals/.run-eval | grep -oE '[0-9]+' || true)"
          fi
          REPEAT="${REPEAT:-1}"
          echo "grading books: $BOOKS (repeat=$REPEAT)"
          rc=0
          for BK in $BOOKS; do
            echo "::group::evals $BK"
            # Tracer keys each book as its own suite (report.tracer_export sets
            # suite=book), so each corpus trends apart under one env label.
            # cel is the synthetic fidelity corpus (no gold voice lines, no
            # continuity injections): grade only what it was built for, to
            # save quota.
            BK_STEPS="$STEPS"
            if [ "$BK" = "cel" ] && [ "$STEPS" = "all" ]; then BK_STEPS="outline"; fi
            EVAL_ENV_LABEL="${BASE_LABEL}" python -m evals.run \
              --book "$BK" --steps "$BK_STEPS" --repeat "$REPEAT" \
              --out "eval-report-$BK.json" --export "gl-export-$BK.json" --tracer $HOLDOUT_FLAG || rc=1
            # The BRD §7 acceptance gate: an outline that loses the author's
            # cast fails the run (docs/BRD.md R1.4).
            if [ "$BK" = "cel" ] && [ -f eval-report-cel.json ]; then
              python -m evals.gate eval-report-cel.json "outline.cast_fidelity>=0.9" || rc=1
            fi
            echo "::endgroup::"
          done
          # Every book ran to its end: the last report's spend is the attempt's whole
          # spend. Without this marker (killed mid-book) the budget charges the ceiling.
          echo '{}' > eval-done.json
          exit $rc
      # The calibration_answers reports merged into the {item_id: answer} file
      # evals.calibration.agreement reads (counts printed, never an answer).
      - name: Calibration answers (steps=calibration_answers)
        if: always()
        env:
          STEPS: ${{ github.event.inputs.steps || 'all' }}
        run: |
          case ",$STEPS," in
            *,calibration_answers,*) ;;
            *) exit 0 ;;
          esac
          ls eval-report-*.json >/dev/null 2>&1 || exit 0
          python -m evals.calibration.answer collect eval-report-*.json --out calibration-answers.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stop app
        if: ${{ always() && github.event.inputs.base_url == '' }}
        run: kill "$(cat /tmp/app.pid)" 2>/dev/null || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # One artifact per attempt (a re-run boots its own database and spends again).
          name: ${{ github.run_attempt == '1' && format('eval-report-{0}', github.run_id) || format('eval-report-{0}-{1}', github.run_id, github.run_attempt) }}
          retention-days: 90
          path: |
            eval-report-*.json
            eval-ceiling.json
            eval-done.json
            gl-export-*.json
            calibration-answers.json
            app.log
          if-no-files-found: warn
