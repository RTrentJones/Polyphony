name: evals

# W14 OpenRouter key probe (wave 14, feasibility record). ONE-OFF, NEVER MERGED:
# replaces the eval job on this branch, runs only by dispatch, reverted after one
# run. GET /api/v1/key, whitelisted fields only (never the label); key values
# are never printed.

on:
  workflow_dispatch:
    inputs:
      run_key_probe: {type: choice, options: ['no', 'yes'], default: 'no'}

permissions:
  contents: read

jobs:
  eval:
    if: inputs.run_key_probe == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Probe
        shell: python
        run: |
          import json, os, urllib.request
          k = os.environ["OPENROUTER_API_KEY"]
          req = urllib.request.Request("https://openrouter.ai/api/v1/key", headers={"Authorization": f"Bearer {k}", "User-Agent": "polyphony-probe/1"})
          d = json.load(urllib.request.urlopen(req, timeout=30)).get("data", {})
          keep = ("is_free_tier", "limit", "limit_remaining", "limit_reset", "usage", "usage_daily", "free_model_daily_requests", "rate_limit")
          text = json.dumps({f: d.get(f) for f in keep}, indent=1)
          assert k not in text
          print(text)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("```\n" + text + "\n```\n")
