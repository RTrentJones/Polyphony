name: evals

# W14-3 Groq re-probe (wave 14). ONE-OFF, NEVER MERGED: replaces the eval job
# on this branch, runs only by dispatch, and is reverted after its one run.
# One tiny chat call per judge provider through the openai SDK client the
# panel uses. Key values are never printed: names and set/unset only.

on:
  workflow_dispatch:
    inputs:
      run_judge_probe: {type: choice, options: ['no', 'yes'], default: 'no'}

permissions:
  contents: read

jobs:
  eval:
    if: inputs.run_judge_probe == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q 'openai>=1.40.0,<2.0.0'
      - name: Probe
        shell: python
        run: |
          import json, os, openai
          keys = {k: os.environ.get(k, "") for k in ("GROQ_API_KEY", "OPENROUTER_API_KEY", "MISTRAL_API_KEY", "CEREBRAS_API_KEY")}
          judges = [
              ("groq", "https://api.groq.com/openai/v1", "GROQ_API_KEY", "openai/gpt-oss-120b"),
              ("openrouter", "https://openrouter.ai/api/v1", "OPENROUTER_API_KEY", "nvidia/nemotron-3-ultra-550b-a55b:free"),
              ("mistral", "https://api.mistral.ai/v1", "MISTRAL_API_KEY", "mistral-small-latest"),
              ("cerebras", "https://api.cerebras.ai/v1", "CEREBRAS_API_KEY", "llama3.1-8b"),
          ]
          def scrub(s):
              for v in keys.values():
                  if v:
                      s = s.replace(v, "***")
              return s
          out = {"keys": {k: "set" if v else "unset" for k, v in keys.items()}, "user_agent": None, "calls": []}
          for name, base, key, model in judges:
              if not keys[key]:
                  out["calls"].append({"provider": name, "model": model, "status": "no key"})
                  continue
              c = openai.OpenAI(base_url=base, api_key=keys[key], max_retries=0, timeout=60)
              out["user_agent"] = c.user_agent
              try:
                  r = c.chat.completions.with_raw_response.create(model=model, messages=[{"role": "user", "content": "Reply with OK."}], max_tokens=8)
                  h = {k: v for k, v in r.headers.items() if k.lower().startswith("x-ratelimit")}
                  out["calls"].append({"provider": name, "model": model, "status": r.status_code, "ratelimit": h})
              except openai.APIStatusError as e:
                  out["calls"].append({"provider": name, "model": model, "status": e.status_code, "body": scrub(str(e.body))[:400]})
              except Exception as e:
                  out["calls"].append({"provider": name, "model": model, "status": type(e).__name__, "body": scrub(str(e))[:400]})
          text = json.dumps(out, indent=1)
          assert not any(v and v in text for v in keys.values())
          print(text)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("```\n" + text + "\n```\n")
