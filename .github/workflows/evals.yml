name: evals

# W13-0 burn probe (wave 13, tpm-plan-wave13 D2). ONE-OFF, NEVER MERGED: this
# branch's evals.yml replaces the eval job with the probe and drops the push:
# and schedule: triggers, so it runs only by an explicit dispatch:
#   gh workflow run evals.yml --ref <branch> -f reset_utc=07   # 08 from 2026-11-01
# Dispatch only within the 120 minutes before the Pacific reset (05:00-07:00
# UTC; 06:00-08:00 from 2026-11-01). The job refuses outside that window.
# It writes probe.json (artifact `probe`) and a job summary. Key VALUES are
# never printed or written: only names and set/unset; any response text is
# scrubbed of every key value before it is stored. Gemini auth is the
# x-goog-api-key header, never ?key= in a URL.

on:
  workflow_dispatch:
    inputs:
      reset_utc:
        description: the Pacific reset hour in UTC (07 until 2026-10-31, 08 from 2026-11-01)
        type: choice
        options: ['07', '08']
        default: '07'

permissions:
  contents: read

concurrency:
  group: evals-probe
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RESET_UTC: ${{ github.event.inputs.reset_utc }}
      PROBE_SHA: ${{ github.sha }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - name: Probe (flash burn <= 110, Flash-Lite, Groq headers, OpenRouter /key + pin)
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from datetime import datetime, timezone

          KEYS = ["GEMINI_API_KEY", "GROQ_API_KEY", "OPENROUTER_API_KEY", "CEREBRAS_API_KEY", "MISTRAL_API_KEY"]
          SECRETS = [os.environ[k] for k in KEYS if os.environ.get(k)]
          BURN_MAX, GAP_S = 110, 7.5  # <= 110 calls at 8 RPM
          GEM = "https://generativelanguage.googleapis.com/v1beta/models/{}:generateContent"
          PINS = ["nvidia/nemotron-3-ultra-550b-a55b:free", "thinkingmachines/inkling:free", "minimax/minimax-m3.1-flash:free"]

          def now():
              return datetime.now(timezone.utc)

          def scrub(text):
              for s in SECRETS:
                  text = text.replace(s, "***")
              return text

          def call(url, headers, body=None):
              req = urllib.request.Request(url, headers=headers, method="POST" if body else "GET",
                                           data=json.dumps(body).encode() if body else None)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, dict(r.headers), scrub(r.read().decode("utf-8", "replace"))
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), scrub(e.read().decode("utf-8", "replace"))
              except Exception as e:  # network error: record its type only
                  return 0, {}, type(e).__name__

          def gemini(model):
              h = {"Content-Type": "application/json", "x-goog-api-key": os.environ["GEMINI_API_KEY"]}
              b = {"contents": [{"parts": [{"text": "Reply with: ok"}]}], "generationConfig": {"maxOutputTokens": 8}}
              return call(GEM.format(model), h, b)

          def violations(body):
              try:
                  details = json.loads(body)["error"].get("details", [])
              except Exception:
                  return []
              return [v for d in details if d.get("@type", "").endswith("QuotaFailure") for v in d.get("violations", [])]

          reset = int(os.environ["RESET_UTC"])
          t0 = now()
          out = {"sha": os.environ["PROBE_SHA"], "reset_utc": f"{reset:02d}", "utc_start": t0.isoformat(),
                 "keys": {k: "set" if os.environ.get(k) else "unset" for k in KEYS}}
          print("keys:", json.dumps(out["keys"]))
          if not (reset - 2 <= t0.hour < reset):
              raise SystemExit(f"::error::outside the 120 min before the {reset:02d}:00 UTC reset; no call made")

          # (a) gemini-3.6-flash bounded burn: stop at the first 429 (its quotaValue is the figure of record).
          fl = {"model": "gemini-3.6-flash", "calls": 0, "ok": 0, "s503": 0, "first_429": None, "first_other": None}
          if os.environ.get("GEMINI_API_KEY"):
              stop = "cap"
              while fl["calls"] < BURN_MAX:
                  if (now() - t0).total_seconds() > 25 * 60:
                      stop = "time"; break
                  if now().hour >= reset:
                      stop = "reset reached"; break
                  st, _, body = gemini(fl["model"])
                  fl["calls"] += 1
                  if st == 200:
                      fl["ok"] += 1
                  elif st == 503:
                      fl["s503"] += 1
                  elif st == 429:
                      vs = violations(body)
                      day = [v for v in vs if "PerDay" in v.get("quotaId", "")]
                      if vs and not day:  # a per-minute limit, not the day's: record once, wait it out, keep counting
                          fl.setdefault("per_minute_429", {"call": fl["calls"], "violations": vs})
                          time.sleep(60); continue
                      fl["first_429"] = {"call": fl["calls"], "at": now().isoformat(), "violations": vs, "body": body}
                      fl["quotaId"] = (day or [{}])[0].get("quotaId")
                      fl["quotaValue"] = (day or [{}])[0].get("quotaValue")
                      stop = "429"; break
                  else:
                      fl["first_other"] = {"call": fl["calls"], "status": st, "body": body}
                      stop = "error"; break
                  time.sleep(GAP_S)
              fl["stopped"] = stop
              fl["rpd_of_record"] = fl.get("quotaValue")
              fl["lower_bound_flag"] = stop == "429" and not fl.get("quotaValue")
          out["flash"] = fl

          # (b) gemini-3.5-flash-lite: one call.
          if os.environ.get("GEMINI_API_KEY"):
              st, _, body = gemini("gemini-3.5-flash-lite")
              out["flash_lite"] = {"status": st, "body": None if st == 200 else body}

          # (c) Groq gpt-oss-120b: one call; the limit headers (TPD is read from Groq's limits page, dated).
          if os.environ.get("GROQ_API_KEY"):
              h = {"Content-Type": "application/json", "Authorization": "Bearer " + os.environ["GROQ_API_KEY"]}
              b = {"model": "openai/gpt-oss-120b", "max_tokens": 8, "messages": [{"role": "user", "content": "Reply with: ok"}]}
              st, hd, body = call("https://api.groq.com/openai/v1/chat/completions", h, b)
              out["groq"] = {"status": st, "headers": {k.lower(): v for k, v in hd.items() if k.lower().startswith("x-ratelimit-")},
                             "body": None if st == 200 else body}

          # (d) OpenRouter: GET /api/v1/key (spends nothing; whitelisted fields only), then the pin rule.
          if os.environ.get("OPENROUTER_API_KEY"):
              h = {"Content-Type": "application/json", "Authorization": "Bearer " + os.environ["OPENROUTER_API_KEY"]}
              st, _, body = call("https://openrouter.ai/api/v1/key", h)
              try:
                  data = json.loads(body).get("data", {})
              except Exception:
                  data = {}
              keep = ("is_free_tier", "limit", "limit_remaining", "limit_reset", "usage", "usage_daily")
              orr = {"key_status": st, "key": {k: data.get(k) for k in keep}, "tries": [], "pin": None}
              st, _, body = call("https://openrouter.ai/api/v1/models", {})
              try:
                  listed = {m["id"] for m in json.loads(body)["data"]}
              except Exception:
                  listed = set()
              for pid in PINS:
                  if pid not in listed:
                      orr["tries"].append({"id": pid, "listed": False}); continue
                  b = {"model": pid, "max_tokens": 8, "messages": [{"role": "user", "content": "Reply with: ok"}]}
                  st, _, body = call("https://openrouter.ai/api/v1/chat/completions", h, b)
                  orr["tries"].append({"id": pid, "listed": True, "status": st, "body": None if st == 200 else body[:2000]})
                  if st == 200:
                      orr["pin"] = pid; break
              out["openrouter"] = orr

          out["utc_end"] = now().isoformat()
          text = scrub(json.dumps(out, indent=2))
          assert not any(s in text for s in SECRETS)
          open("probe.json", "w").write(text)
          f = out["flash"]
          lines = ["## W13-0 probe", "", f"reset_utc {out['reset_utc']}, {out['utc_start']} to {out['utc_end']}", "",
                   "keys: " + ", ".join(f"{k} {v}" for k, v in out["keys"].items()), "",
                   f"flash: calls {f['calls']}, 200 {f['ok']}, 503 {f['s503']}, stopped {f.get('stopped')}, "
                   f"quotaId {f.get('quotaId')}, quotaValue {f.get('quotaValue')}, lower-bound flag {f.get('lower_bound_flag')}",
                   f"flash-lite: {out.get('flash_lite', {}).get('status')}",
                   f"groq: {out.get('groq', {}).get('status')} {json.dumps(out.get('groq', {}).get('headers'))}",
                   f"openrouter: key {json.dumps(out.get('openrouter', {}).get('key'))}, pin {out.get('openrouter', {}).get('pin')}"]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(scrub("\n".join(lines)) + "\n")
          print("probe.json written")
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe.json
          if-no-files-found: warn
          retention-days: 30
