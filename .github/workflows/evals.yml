name: evals

# W14-5 rate-state cleanup (wave 14). ONE-OFF, NEVER MERGED: replaces the eval
# job on this branch, runs only by dispatch, and is reverted after its one run.
# Re-uploads run 39574086903's baseline-rate-state without the one memoized
# reply that cannot be parsed (Nemotron's reasoning cut off at 640 tokens,
# cached at P before P′), so the next rate dispatch resumes from it at P″.
# Replies answer blinded prompts; no key, record or state of a generate run is read.

on:
  workflow_dispatch:
    inputs:
      run_cleanup: {type: choice, options: ['no', 'yes'], default: 'no'}

permissions:
  contents: read
  actions: read

jobs:
  cleanup:
    if: inputs.run_cleanup == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the rate-state only
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download 39574086903 -n baseline-rate-state -D rate-state -R "$GITHUB_REPOSITORY"
      - name: Remove the one unparseable reply
        run: |
          set -euo pipefail
          bad=rate-state/cache/panel/panel-4c92d396408f6e102cf0.json
          [ "$(find rate-state -type f | wc -l)" = 126 ]
          [ -f "$bad" ]
          rm "$bad"
          [ "$(find rate-state -type f | wc -l)" = 125 ]
          echo "rate-state: 125 replies, removed panel-4c92d396408f6e102cf0" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: baseline-rate-state, path: rate-state, retention-days: 30, include-hidden-files: false}
