name: evals

# W13-1 TPM probe (wave 13, signed generator rule test (ii)). ONE-OFF, NEVER
# MERGED: this branch's evals.yml replaces the eval job with the probe and drops
# the push: and schedule: triggers, so it runs only by an explicit dispatch:
#   gh workflow run evals.yml --ref <branch> -f run_tpm_probe=yes
# Question: does ONE gemini-3.5-flash-lite request of ~42.7k+ prompt tokens fit
# the free-tier per-minute token cap? It sends one ~210k-character prompt built
# from the repo's public-domain corpora (maxOutputTokens 8) and, on a 200, one
# identical call 5 s later. It writes tpm_probe.json (artifact `tpm-probe`) and
# a job summary. Key VALUES are never printed or written: only names and
# set/unset; any response text is scrubbed of every key value before it is
# stored. Gemini auth is the x-goog-api-key header, never ?key= in a URL.

on:
  workflow_dispatch:
    inputs:
      run_tpm_probe:
        description: type yes to send the ~44k-token Flash-Lite probe
        type: choice
        options: ['no', 'yes']
        default: 'no'

permissions:
  contents: read

concurrency:
  group: evals-probe
  cancel-in-progress: false

jobs:
  eval:
    if: ${{ github.event.inputs.run_tpm_probe == 'yes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROBE_SHA: ${{ github.sha }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Probe (Flash-Lite, one ~44k-token call, a second on 200)
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from datetime import datetime, timezone

          KEYS = ["GEMINI_API_KEY"]
          SECRETS = [os.environ[k] for k in KEYS if os.environ.get(k)]
          MODEL = "gemini-3.5-flash-lite"
          URL = f"https://generativelanguage.googleapis.com/v1beta/models/{MODEL}:generateContent"
          CORPORA = ["evals/corpora/wuthering/excerpts.txt", "evals/corpora/frankenstein/excerpts.txt"]
          TARGET_CHARS, PASS_TOKENS, BUDGET_S = 210_000, 42_700, 10 * 60

          def now():
              return datetime.now(timezone.utc)

          def scrub(text):
              for s in SECRETS:
                  text = text.replace(s, "***")
              return text

          def details(body, suffix):
              try:
                  ds = json.loads(body)["error"].get("details", [])
              except Exception:
                  return []
              return [d for d in ds if d.get("@type", "").endswith(suffix)]

          def per_minute_token(vs):
              return [v for v in vs if "PerMinute" in v.get("quotaId", "") and "Token" in v.get("quotaId", "")]

          # The prompt: both corpora, repeated as needed, cut to TARGET_CHARS, then the instruction.
          corpus = "\n\n".join(open(p, encoding="utf-8").read() for p in CORPORA)
          text = (corpus * (TARGET_CHARS // len(corpus) + 1))[:TARGET_CHARS]
          prompt = text + "\n\nReply with the single word OK."
          body = json.dumps({"contents": [{"parts": [{"text": prompt}]}],
                             "generationConfig": {"maxOutputTokens": 8}}).encode()

          t0 = now()
          out = {"sha": os.environ["PROBE_SHA"], "model": MODEL, "utc_start": t0.isoformat(),
                 "keys": {k: "set" if os.environ.get(k) else "unset" for k in KEYS},
                 "prompt_chars": len(prompt), "calls": []}
          print("keys:", json.dumps(out["keys"]), "prompt_chars:", len(prompt))

          def probe(n):
              left = BUDGET_S - (now() - t0).total_seconds()
              if left < 5:
                  return {"call": n, "skipped": "10-minute budget spent"}
              req = urllib.request.Request(URL, data=body, method="POST", headers={
                  "Content-Type": "application/json", "x-goog-api-key": os.environ["GEMINI_API_KEY"]})
              rec = {"call": n, "at": now().isoformat()}
              try:
                  with urllib.request.urlopen(req, timeout=min(180, left)) as r:
                      st, raw = r.status, scrub(r.read().decode("utf-8", "replace"))
              except urllib.error.HTTPError as e:
                  st, raw = e.code, scrub(e.read().decode("utf-8", "replace"))
              except Exception as e:  # network error or timeout: record its type only
                  st, raw = 0, type(e).__name__
              rec["status"] = st
              try:
                  resp = json.loads(raw) if st == 200 else {}
              except Exception:
                  resp = {}
              u = resp.get("usageMetadata", {})
              rec["usageMetadata"] = {k: u.get(k) for k in ("promptTokenCount", "totalTokenCount")}
              rec["modelVersion"] = resp.get("modelVersion")
              if st == 429:
                  rec["violations"] = [{k: v.get(k) for k in ("quotaId", "quotaValue", "quotaDimensions")}
                                       for d in details(raw, "QuotaFailure") for v in d.get("violations", [])]
                  rec["retryInfo"] = [d.get("retryDelay") for d in details(raw, "RetryInfo")]
                  rec["per_minute_token_violation"] = bool(per_minute_token(rec["violations"]))
              if st != 200:
                  rec["body"] = raw[:4000]
              print(json.dumps({k: rec.get(k) for k in ("call", "status", "usageMetadata", "modelVersion")}))
              return rec

          if os.environ.get("GEMINI_API_KEY"):
              out["calls"].append(probe(1))
              if out["calls"][0].get("status") == 200:
                  time.sleep(5)
                  out["calls"].append(probe(2))

          c1 = out["calls"][0] if out["calls"] else {}
          c2 = out["calls"][1] if len(out["calls"]) > 1 else {}
          ptc = (c1.get("usageMetadata") or {}).get("promptTokenCount") or 0
          if c1.get("status") == 200 and ptc >= PASS_TOKENS:
              out["verdict"] = "pass"
          elif c1.get("per_minute_token_violation"):
              out["verdict"] = "fail"
          else:
              out["verdict"] = "inconclusive"
          # A per-minute token 429 on the second call puts the cap between one and two prompts.
          out["second_call_per_minute_token_429"] = bool(c2.get("per_minute_token_violation"))
          out["utc_end"] = now().isoformat()

          dump = scrub(json.dumps(out, indent=2))
          assert not any(s in dump for s in SECRETS)
          open("tpm_probe.json", "w").write(dump)
          lines = ["## W13-1 TPM probe", "", f"{out['utc_start']} to {out['utc_end']}, sha {out['sha']}", "",
                   "keys: " + ", ".join(f"{k} {v}" for k, v in out["keys"].items()),
                   f"prompt chars: {out['prompt_chars']}", f"**verdict: {out['verdict']}**", ""]
          for c in out["calls"]:
              lines.append(f"- call {c['call']}: status {c.get('status', c.get('skipped'))}, "
                           f"usage {json.dumps(c.get('usageMetadata'))}, modelVersion {c.get('modelVersion')}, "
                           f"violations {json.dumps(c.get('violations'))}, retry {c.get('retryInfo')}")
          if out["second_call_per_minute_token_429"]:
              lines.append("")
              lines.append("second call hit a per-minute token limit: cap between one and two prompts")
          summary = scrub("\n".join(lines))
          assert not any(s in summary for s in SECRETS)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(summary + "\n")
          print("tpm_probe.json written, verdict", out["verdict"])
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpm-probe
          path: tpm_probe.json
          if-no-files-found: warn
          retention-days: 30
