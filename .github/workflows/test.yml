name: Test Suite

on:
  push:
    branches: [main, develop, claude/**]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # A real pgvector Postgres so the Postgres-only paths — the migrations
    # (incl. the destructive legacy-reset self-heal), the voice_chunks FK, and the
    # pgvector round-trip — are exercised BEFORE merge, not only in the post-merge
    # ship gate. The sqlite unit suite structurally can't see them.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci_password_12345
          POSTGRES_DB: polyphony_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps (libmagic for upload sniffing)
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Tests are BLOCKING: the same suite gates the container build in
      # greenlight-build.yml, so a red test means no image ships.
      - name: Run tests (sqlite)
        env:
          SECRET_KEY: ci_secret_key_minimum_32_characters_long
          POSTGRES_PASSWORD: ci_password_12345
        run: python -m pytest tests -q --no-cov

      # Postgres-only integration tests (RUN_PG_TESTS), including the destructive
      # migration self-heal (legacy reset + rollback safety). Gating these here
      # means risky migration behavior is proven before merge.
      - name: Integration tests (pgvector)
        env:
          SECRET_KEY: ci_secret_key_minimum_32_characters_long
          RUN_PG_TESTS: "1"
          DATABASE_URL: postgresql+asyncpg://postgres:ci_password_12345@localhost:5432/polyphony_test
        run: python -m pytest tests/integration -m integration -o addopts="" -q

  # The REAL app, end to end, against the deterministic stub LLM
  # (evals/stub_llm.py): upload -> extraction proposals -> reviewed commit ->
  # voice indexing -> staged outline -> scene -> continuity, through the HTTP
  # API. Free (no key, no quota), so it gates every PR — including the BRD §7
  # fidelity gate on the `cel` corpus (cast_fidelity >= 0.9). The stub answers
  # only from what the prompt contains, so a pipeline that stops delivering the
  # canon to the model fails here.
  e2e:
    name: End-to-end (stub LLM)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci_password_12345
          POSTGRES_DB: polyphony_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci_secret_key_minimum_32_characters_long
      DATABASE_URL: postgresql+asyncpg://postgres:ci_password_12345@localhost:5432/polyphony_e2e
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system deps (libmagic for upload sniffing)
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install dependencies
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the static frontend (served by the app for the browser journey)
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Playwright + Chromium
        run: pip install 'playwright==1.48.0' && python -m playwright install --with-deps chromium
      - name: Run end-to-end flows + gates (API evals, then the browser journey)
        env:
          RUN_BROWSER_E2E: "1"
        run: scripts/e2e_stub.sh
      - name: Upload reports + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}
          path: |
            eval-report-e2e-*.json
            e2e-*.log
            e2e-shots/
          if-no-files-found: warn

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Pinned: an unpinned `pip install black ruff` silently tracks the latest
      # release, so a new black stable-style bump reformats files and reddens CI
      # with no code change. Bump these deliberately.
      - name: Install lint tools
        run: pip install 'black==26.5.1' 'ruff==0.15.21'

      - name: Black
        run: black --check app tests alembic evals

      - name: Ruff
        run: ruff check app tests alembic evals

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # A red build here means the static export the container serves is broken.
      - name: Build (static export)
        run: npm run build
